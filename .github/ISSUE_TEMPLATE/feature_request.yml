name: Feature request
description: A capability that is missing or should work differently
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        [docs/roadmap.md](../docs/roadmap.md) lists the open candidates — this may
        already be covered there.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the platform does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it behave? If you know the codebase, where would it live?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
