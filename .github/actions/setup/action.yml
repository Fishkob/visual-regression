name: Setup
description: Install pnpm deps and generate Prisma client (requires checkout first)

inputs:
  generate-prisma:
    description: Whether to generate Prisma client
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      if: ${{ inputs.generate-prisma == 'true' }}
      shell: bash
      env:
        DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public
      run: pnpm --filter ./backend prisma:generate
