version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /.github/actions/setup
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions-composite:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # 3.3.14 fails the frontend type check with TS2339 "Property 'value' does
      # not exist" on template reads through a component slot; lift when fixed.
      - dependency-name: "vue-tsc"
        versions: ["3.3.14"]
      # TypeScript 7 is the native compiler port. The backend pins TS 6 through
      # npm:@typescript/typescript6 plus its tsc6 binary, and vue-tsc's Volar
      # layer declares typescript <7, so 7 needs a migration of its own.
      - dependency-name: "typescript"
        versions: [">=7.0.0 <8"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-backend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /pdf-sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-pdf-sidecar:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-compose:
        patterns: ["*"]
        update-types: ["minor", "patch"]
