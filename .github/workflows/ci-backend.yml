name: CI (Backend)

permissions:
  contents: read

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      skipTests:
        description: "Skip tests (faster validation)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "client-sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "docker-compose*.yml"
      - ".github/actions/setup/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/sdk-sync-check.yml"
      - "openapi-ts.config.ts"
      - "!frontend/**"
      - "!README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "client-sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "docker-compose*.yml"
      - ".github/actions/setup/**"
      - ".github/workflows/ci-backend.yml"
      - ".github/workflows/sdk-sync-check.yml"
      - "openapi-ts.config.ts"
      - "!frontend/**"
      - "!README.md"

jobs:
  sdk-sync-check:
    uses: ./.github/workflows/sdk-sync-check.yml

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run ESLint & TypeCheck (Backend)
        if: github.event.inputs.skipTests != 'true'
        run: pnpm run lint:check && pnpm run typecheck && pnpm run typecheck:test
        working-directory: backend

      - name: Run Prettier
        if: github.event.inputs.skipTests != 'true'
        run: pnpm run format:check

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck, sdk-sync-check]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: pnpm --filter ./backend test:cov

      - name: Assert coverage ran
        run: test -f backend/coverage/unit/coverage-final.json

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: backend-unit
    if: github.event.inputs.skipTests != 'true'
    # docker compose interpolates x-app-env for the whole file, so the required
    # TOTP key must be set even when only the infra services are started.
    env:
      TOTP_ENCRYPTION_KEY: ci-backend-totp-key-0123456789abcdef

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # The e2e bootstrap (backend/test/e2e/global/setup.ts) refuses to run
      # against a partial stack: it wants Postgres, RustFS and the pdf sidecar
      # listening, or nothing at all so it can start them itself. The infra file
      # holds only Postgres and RustFS, so the stack comes up from the root
      # compose, which includes that file and adds the sidecar.
      - name: Start infra (postgres / rustfs / pdf-sidecar)
        run: |
          docker compose up -d postgres rustfs pdf-sidecar
          docker compose ps

      - name: Wait for infra
        run: |
          set -e

          echo "Waiting for Postgres..."
          READY=0
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs postgres
            echo "Postgres did not become ready in time"
            exit 1
          fi

          echo "Waiting for RustFS..."
          READY=0
          for i in {1..60}; do
            if nc -z 127.0.0.1 9000; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs rustfs
            echo "RustFS did not become ready in time"
            exit 1
          fi

          echo "Waiting for the pdf sidecar..."
          READY=0
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs pdf-sidecar
            echo "pdf-sidecar did not become ready in time"
            exit 1
          fi

      - name: Run e2e tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

          STORAGE_ENDPOINT: 127.0.0.1
          STORAGE_PORT: "9000"
          STORAGE_ACCESS_KEY: rustfsadmin
          STORAGE_SECRET_KEY: rustfsadmin
          STORAGE_BUCKET: vrt
          STORAGE_USE_SSL: "false"
        run: pnpm run test:e2e:ci

      - name: Check migration drift
        run: |
          set -e

          echo "Starting Postgres for drift check..."
          docker compose up -d postgres

          echo "Waiting for Postgres..."
          READY=0
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs postgres
            echo "Postgres did not become ready in time"
            exit 1
          fi

          cd backend
          pnpm exec prisma migrate deploy

          set +e
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code >/tmp/drift.txt 2>&1
          EXIT=$?
          cat /tmp/drift.txt
          if [ "$EXIT" -eq 2 ]; then
            echo "Migration drift: DB schema (after migrate deploy) differs from schema.prisma"
            exit 1
          fi
          if [ "$EXIT" -ne 0 ]; then
            echo "prisma migrate diff errored (exit $EXIT)"
            exit 1
          fi
          echo "No migration drift"
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrt
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

      - name: Dump docker logs
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown infra
        if: always()
        run: docker compose down -v
