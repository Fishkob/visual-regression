name: CI (Backend)

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      skipTests:
        description: "Skip tests (faster validation)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, develop]
    # A docs-only push starts neither CI workflow: no branch protection depends
    # on a push run, so it only spends runner minutes on markdown. The
    # pull_request trigger below stays unfiltered — see the comment on `changes`.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/ISSUE_TEMPLATE/**"
      - "skills-lock.json"
  pull_request:
    branches: [main, develop]

jobs:
  # The pull_request trigger has no path filter on purpose: a filtered-out
  # workflow never starts, so its required status check stays pending and blocks
  # a PR that touches nothing in backend/. A gated job still reports (as skipped)
  # and the gate below is the single check to require. Only the push trigger is
  # filtered, where that trade does not exist.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # A manual run is an explicit request to run the checks; the filter would
      # compare against the previous commit on the branch and skip everything.
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            backend:
              - "backend/**"
              - "client-sdk/**"
              - "pdf-sidecar/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
              - "docker-compose*.yml"
              - ".github/actions/setup/**"
              - ".github/workflows/ci-backend.yml"
              - ".github/workflows/sdk-sync-check.yml"
              - "openapi-ts.config.ts"

  sdk-sync-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/sdk-sync-check.yml

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Run ESLint & TypeCheck (Backend)
        if: github.event.inputs.skipTests != 'true'
        run: pnpm run lint:check && pnpm run typecheck && pnpm run typecheck:test
        working-directory: backend

      - name: Run Prettier
        if: github.event.inputs.skipTests != 'true'
        run: pnpm run format:check

  backend-unit:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: pnpm --filter ./backend test:cov

      - name: Assert coverage ran
        run: test -f backend/coverage/unit/coverage-final.json

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: needs.changes.outputs.backend == 'true' && github.event.inputs.skipTests != 'true'
    # docker compose interpolates x-app-env for the whole file, so its required
    # secrets must be set even when only the infra services are started.
    env:
      TOTP_ENCRYPTION_KEY: ci-backend-totp-key-0123456789abcdef
      POSTGRES_PASSWORD: postgres
      RUSTFS_ROOT_PASSWORD: rustfsadmin

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      # The e2e bootstrap (backend/test/e2e/global/setup.ts) refuses to run
      # against a partial stack: it wants Postgres, RustFS and the pdf sidecar
      # listening, or nothing at all so it can start them itself. The infra file
      # holds only Postgres and RustFS, so the stack comes up from the root
      # compose, which includes that file and adds the sidecar.
      - name: Start infra (postgres / rustfs / pdf-sidecar)
        run: |
          docker compose up -d postgres rustfs pdf-sidecar
          docker compose ps

      - name: Wait for infra
        run: |
          set -e

          echo "Waiting for Postgres..."
          READY=0
          for i in {1..60}; do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs postgres
            echo "Postgres did not become ready in time"
            exit 1
          fi

          echo "Waiting for RustFS..."
          READY=0
          for i in {1..60}; do
            if nc -z 127.0.0.1 9000; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs rustfs
            echo "RustFS did not become ready in time"
            exit 1
          fi

          echo "Waiting for the pdf sidecar..."
          READY=0
          for i in {1..120}; do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose logs pdf-sidecar
            echo "pdf-sidecar did not become ready in time"
            exit 1
          fi

      - name: Run e2e tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

          STORAGE_ENDPOINT: 127.0.0.1
          STORAGE_PORT: "9000"
          STORAGE_ACCESS_KEY: rustfsadmin
          STORAGE_SECRET_KEY: rustfsadmin
          STORAGE_BUCKET: vrt
          STORAGE_USE_SSL: "false"
        run: pnpm run test:e2e:ci

      - name: Check migration drift
        run: |
          set -e

          # Postgres is already up and awaited by the infra step above.
          cd backend
          pnpm exec prisma migrate deploy

          set +e
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code >/tmp/drift.txt 2>&1
          EXIT=$?
          cat /tmp/drift.txt
          if [ "$EXIT" -eq 2 ]; then
            echo "Migration drift: DB schema (after migrate deploy) differs from schema.prisma"
            exit 1
          fi
          if [ "$EXIT" -ne 0 ]; then
            echo "prisma migrate diff errored (exit $EXIT)"
            exit 1
          fi
          echo "No migration drift"
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrt
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

      - name: Dump docker logs
        if: failure()
        run: docker compose logs --no-color

      - name: Shutdown infra
        if: always()
        run: docker compose down -v

  gate:
    name: Backend CI Gate
    # The one status a branch protection rule has to require: it runs even when
    # every other job was skipped for an unrelated change, and fails when one of
    # them failed or was cancelled. The name carries the area because required
    # checks match on the job name only, not on the workflow that produced it.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [changes, sdk-sync-check, lint-and-typecheck, backend-unit, backend-e2e]
    if: always()
    steps:
      - name: Job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS"

      - name: Fail on a failed or cancelled job
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
