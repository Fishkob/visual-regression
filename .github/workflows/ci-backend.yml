name: CI (Backend)

on:
  workflow_dispatch:
    inputs:
      skipTests:
        description: "Skip tests (faster validation)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "client-sdk/**"
      - "package.json"
      - "!frontend/**"
      - "!README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "client-sdk/**"
      - "package.json"
      - "!frontend/**"
      - "!README.md"

jobs:
  sdk-sync-check:
    uses: ./.github/workflows/sdk-sync-check.yml

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Run ESLint & TypeCheck (Backend)
        if: github.event.inputs.skipTests != 'true'
        run: pnpm run lint:check && pnpm run typecheck && pnpm run typecheck:test
        working-directory: backend

      - name: Run Prettier
        if: github.event.inputs.skipTests != 'true'
        run: pnpm run format:check

  backend-unit:
    name: Backend Unit Tests (Coverage ≥ 70%)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, sdk-sync-check]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: pnpm --filter ./backend test:cov

      - name: Check coverage threshold
        run: |
          COVERAGE=$(cat backend/coverage/coverage-summary.json | jq -r '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if [ "$(echo "$COVERAGE < 70" | awk '{print ($1 < 70 ? 1 : 0)}')" = "1" ]; then
            echo "❌ Coverage $COVERAGE% is below 70% threshold"
            exit 1
          fi
          echo "✅ Coverage $COVERAGE% meets 70% threshold"

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: backend-unit
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Start infra (postgres / minio)
        run: |
          docker compose -f docker-compose.infra.yml up -d
          docker compose -f docker-compose.infra.yml ps

      - name: Wait for infra
        run: |
          set -e

          echo "Waiting for Postgres..."
          READY=0
          for i in {1..60}; do
            if docker compose -f docker-compose.infra.yml exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose -f docker-compose.infra.yml logs postgres
            echo "❌ Postgres did not become ready in time"
            exit 1
          fi

          echo "Waiting for MinIO..."
          READY=0
          for i in {1..60}; do
            if nc -z 127.0.0.1 9000; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose -f docker-compose.infra.yml logs minio
            echo "❌ MinIO did not become ready in time"
            exit 1
          fi

      - name: Run e2e tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

          STORAGE_ENDPOINT: 127.0.0.1
          STORAGE_PORT: "9000"
          STORAGE_ACCESS_KEY: minioadmin
          STORAGE_SECRET_KEY: minioadmin
          STORAGE_BUCKET: vrt
          STORAGE_USE_SSL: "false"
        run: pnpm run test:e2e:ci

      - name: Check migration drift
        run: |
          set -e

          echo "Starting Postgres for drift check..."
          docker compose -f docker-compose.infra.yml up -d postgres

          echo "Waiting for Postgres..."
          READY=0
          for i in {1..60}; do
            if docker compose -f docker-compose.infra.yml exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose -f docker-compose.infra.yml logs postgres
            echo "❌ Postgres did not become ready in time"
            exit 1
          fi

          cd backend
          pnpm exec prisma migrate deploy

          set +e
          pnpm exec prisma migrate diff \
            --from-config-datasource \
            --to-schema prisma/schema.prisma \
            --exit-code >/tmp/drift.txt 2>&1
          EXIT=$?
          cat /tmp/drift.txt
          if [ "$EXIT" -eq 2 ]; then
            echo "❌ Migration drift: DB schema (after migrate deploy) differs from schema.prisma"
            exit 1
          fi
          if [ "$EXIT" -ne 0 ]; then
            echo "❌ prisma migrate diff errored (exit $EXIT)"
            exit 1
          fi
          echo "✅ No migration drift"
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrt
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

      - name: Dump docker logs
        if: failure()
        run: docker compose -f docker-compose.infra.yml logs --no-color

      - name: Shutdown infra
        if: always()
        run: docker compose -f docker-compose.infra.yml down -v
