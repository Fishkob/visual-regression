name: CI (Frontend)

on:
  workflow_dispatch:
    inputs:
      skipTests:
        description: "Skip tests (faster validation)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "!README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "!README.md"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Run ESLint & TypeCheck (Frontend)
        run: pnpm run lint:check && pnpm run typecheck
        working-directory: frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Build Frontend
        run: pnpm --filter ./frontend build

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Run Unit Tests
        run: pnpm --filter ./frontend test
        working-directory: frontend

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  frontend-ct:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Install Playwright browsers
        run: pnpm --filter ./frontend exec playwright install chromium

      - name: Run Playwright Component Tests
        run: pnpm --filter ./frontend test-ct

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Start full stack (infra + backend + frontend)
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for infrastructure
        run: |
          echo "Waiting for Postgres..."
          READY=0
          for i in {1..60}; do
            if docker compose -f docker-compose.yml exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose -f docker-compose.yml logs postgres
            echo "❌ Postgres did not become ready in time"
            exit 1
          fi

          echo "Waiting for MinIO..."
          READY=0
          for i in {1..60}; do
            if nc -z 127.0.0.1 9000; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose -f docker-compose.yml logs minio
            echo "❌ MinIO did not become ready in time"
            exit 1
          fi

      - name: Wait for backend health
        run: |
          echo "Waiting for backend (DB)..."
          for i in {1..60}; do curl -sf http://localhost:3000/api/v1/health/db && break; sleep 1; done
          curl -sf http://localhost:3000/api/v1/health/db

          echo "Waiting for backend (MinIO)..."
          for i in {1..60}; do curl -sf http://localhost:3000/api/v1/health/minio && break; sleep 1; done
          curl -sf http://localhost:3000/api/v1/health/minio

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend..."
          for i in {1..60}; do nc -z 127.0.0.1 80 && break; sleep 1; done
          nc -z 127.0.0.1 80

      - name: Setup Database
        run: cd backend && pnpm exec prisma migrate deploy
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrt
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

      - name: Seed E2E test data
        run: cd backend && pnpm exec tsx src/scripts/seeds/seed-e2e.ts

      - name: Install Playwright browsers
        run: |
          cd frontend
          pnpm exec playwright install chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          FRONTEND_URL: http://localhost:80
        run: pnpm test-e2e

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
