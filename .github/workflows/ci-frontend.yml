name: CI (Frontend)

permissions:
  contents: read

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      skipTests:
        description: "Skip tests (faster validation)"
        required: false
        default: false
        type: boolean
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "docker-compose*.yml"
      - "scripts/quality.sh"
      - "frontend/Dockerfile.quality"
      - "client-sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".dockerignore"
      - ".github/actions/setup/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/sdk-sync-check.yml"
      - "openapi-ts.config.ts"
      - "!README.md"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"
      - "docker-compose*.yml"
      - "scripts/quality.sh"
      - "frontend/Dockerfile.quality"
      - "client-sdk/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".dockerignore"
      - ".github/actions/setup/**"
      - ".github/workflows/ci-frontend.yml"
      - ".github/workflows/sdk-sync-check.yml"
      - "openapi-ts.config.ts"
      - "!README.md"

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Run ESLint & TypeCheck (Frontend)
        run: pnpm run lint:check && pnpm run typecheck
        working-directory: frontend

      - name: Run Prettier
        run: pnpm exec prettier --check "src/**/*.{ts,vue,js,json,css,md}"
        working-directory: frontend

      - name: Check i18n key parity
        run: pnpm run i18n:check
        working-directory: frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Build Frontend
        run: pnpm --filter ./frontend build

  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Run Unit Tests
        run: pnpm --filter ./frontend test:coverage
        working-directory: frontend

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 7

  frontend-ct:
    name: Frontend Component Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Install Playwright browsers
        run: pnpm --filter ./frontend exec playwright install chromium

      - name: Run Playwright Component Tests
        run: pnpm --filter ./frontend test-ct

  frontend-quality:
    name: Frontend Theme Quality
    # The committed baselines are Linux amd64, produced by the pinned quality
    # image so local x86_64 machines and CI render identically.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    needs: [build]
    if: github.event.inputs.skipTests != 'true'

    steps:
      - uses: actions/checkout@v7

      - name: Verify x86_64 runner
        run: test "$(uname -m)" = "x86_64"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build quality image
        run: >
          docker buildx build --load
          --platform linux/amd64
          --cache-from type=gha,scope=frontend-quality
          --cache-to type=gha,mode=max,scope=frontend-quality
          -f frontend/Dockerfile.quality
          -t visual-regression-frontend-quality:ci .

      - name: Verify image architecture
        run: |
          test "$(docker image inspect --format '{{.Architecture}}' visual-regression-frontend-quality:ci)" = "amd64"

      - name: Visual regression (light + dark)
        run: ./scripts/quality.sh visual --no-build
        env:
          QUALITY_IMAGE: visual-regression-frontend-quality:ci
          QUALITY_PLATFORM: linux/amd64

      - name: Accessibility (light + dark)
        run: ./scripts/quality.sh a11y --no-build
        env:
          QUALITY_IMAGE: visual-regression-frontend-quality:ci
          # The image was built and loaded as linux/amd64 above; asking docker
          # for another platform cannot resolve against a single-arch image and
          # fails the step before a single scan runs.
          QUALITY_PLATFORM: linux/amd64

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-quality-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [build]
    if: github.event.inputs.skipTests != 'true'
    # The stack runs NODE_ENV=production, where ADMIN_API_KEY and METRICS_API_KEY
    # have a 32 character floor (backend/src/config/env.validation.ts). Keeping
    # them job-wide stops the compose env and the probing steps from drifting
    # apart — the 17 character admin key used to keep the backend from booting.
    env:
      ADMIN_API_KEY: ci-frontend-admin-0123456789abcdef
      METRICS_API_KEY: ci-frontend-metrics-0123456789abcd
      # The bootstrap admin carries a temporary password; one step below makes it
      # permanent and rewrites E2E_ADMIN_PASSWORD, so the UI fixture and the API
      # helpers keep reading one variable.
      BOOTSTRAP_ADMIN_USERNAME: ci-admin
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-temp-password
      E2E_ADMIN_USERNAME: ci-admin
      E2E_ADMIN_PASSWORD: ci-admin-temp-password
      E2E_ADMIN_PASSWORD_FINAL: ci-admin-final-password
      # The stack boots NODE_ENV=production, where TOTP_ENCRYPTION_KEY is
      # required (backend/src/config/env.validation.ts) and docker compose
      # refuses to interpolate x-app-env without it.
      TOTP_ENCRYPTION_KEY: ci-frontend-totp-key-0123456789abcdef
      # The suite logs in far more often than a browser session ever would.
      LOGIN_RATE_LIMIT_PER_MINUTE: "1000"

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build app images (gha-cached)
        run: docker buildx bake -f docker-compose.yml --load

      - name: Start full stack (infra + backend + frontend)
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for infrastructure
        run: |
          echo "Waiting for Postgres..."
          READY=0
          for i in {1..60}; do
            if docker compose -f docker-compose.yml exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose -f docker-compose.yml logs postgres
            echo "Postgres did not become ready in time"
            exit 1
          fi

          echo "Waiting for RustFS..."
          READY=0
          for i in {1..60}; do
            if nc -z 127.0.0.1 9000; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker compose -f docker-compose.yml logs rustfs
            echo "RustFS did not become ready in time"
            exit 1
          fi

      - name: Wait for backend health
        run: |
          echo "Waiting for backend (DB)..."
          for i in {1..60}; do curl -sf -H "x-metrics-key: $METRICS_API_KEY" http://localhost:3000/api/v1/health/db && break; sleep 1; done
          curl -sf -H "x-metrics-key: $METRICS_API_KEY" http://localhost:3000/api/v1/health/db

          echo "Waiting for backend (RustFS)..."
          for i in {1..60}; do curl -sf -H "x-metrics-key: $METRICS_API_KEY" http://localhost:3000/api/v1/health/storage && break; sleep 1; done
          curl -sf -H "x-metrics-key: $METRICS_API_KEY" http://localhost:3000/api/v1/health/storage

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend..."
          for i in {1..60}; do nc -z 127.0.0.1 80 && break; sleep 1; done
          nc -z 127.0.0.1 80

      - name: Setup Database
        run: cd backend && pnpm exec prisma migrate deploy
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vrt
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public

      - name: Seed E2E test data
        run: cd backend && pnpm exec tsx src/scripts/seeds/seed-e2e.ts
        env:
          E2E_API_KEY_FILE: /tmp/e2e-api-key

      - name: Capture e2e API key
        run: echo "E2E_API_KEY=$(cat /tmp/e2e-api-key)" >> "$GITHUB_ENV"

      - name: Replace the bootstrap admin's temporary password
        run: |
          set -euo pipefail
          api=http://localhost:3000/api/v1
          jar="$(mktemp)"
          curl -fsS -c "$jar" -H 'Content-Type: application/json' \
            -d "{\"username\":\"$E2E_ADMIN_USERNAME\",\"password\":\"$E2E_ADMIN_PASSWORD\"}" \
            "$api/auth/login" >/dev/null
          curl -fsS -b "$jar" -H 'Content-Type: application/json' \
            -d "{\"currentPassword\":\"$E2E_ADMIN_PASSWORD\",\"newPassword\":\"$E2E_ADMIN_PASSWORD_FINAL\"}" \
            "$api/auth/change-password" >/dev/null
          echo "The bootstrap admin's temporary password was replaced."

      - name: Install Playwright browsers
        run: |
          cd frontend
          pnpm exec playwright install chromium

      - name: Run E2E tests
        working-directory: frontend
        env:
          FRONTEND_URL: http://localhost:80
          E2E_API_KEY: ${{ env.E2E_API_KEY }}
          # The permanent one: the step above replaced the temporary password.
          E2E_ADMIN_PASSWORD: ${{ env.E2E_ADMIN_PASSWORD_FINAL }}
        run: pnpm test-e2e

      - name: Dump docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
