name: Cleanup old images

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 3am
  workflow_dispatch:
    inputs:
      keep:
        description: "Number of images to keep"
        required: false
        type: string
        default: "3"

jobs:
  cleanup-backend:
    name: Cleanup old backend images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete old versions
        run: |
          KEEP=${{ github.event.inputs.keep || '3' }}

          echo "Fetching backend versions (newest first)..."
          VERSIONS=$(gh api -XGET \
            "/users/${{ github.repository_owner }}/packages/container/visual-regression-backend/versions" \
            --jq 'sort_by(.created_at) | reverse | .[].id')

          if [ -z "$VERSIONS" ]; then
            echo "No versions found"
            exit 0
          fi

          echo "Found versions: $VERSIONS"

          COUNT=0
          for VERSION_ID in $VERSIONS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting backend version: $VERSION_ID"
              gh api -XDELETE "/users/${{ github.repository_owner }}/packages/container/visual-regression-backend/versions/$VERSION_ID" || echo "Failed to delete $VERSION_ID, skipping"
            fi
          done

          echo "Kept $KEEP latest images, deleted older ones"

  cleanup-frontend:
    name: Cleanup old frontend images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete old versions
        run: |
          KEEP=${{ github.event.inputs.keep || '3' }}

          echo "Fetching frontend versions (newest first)..."
          VERSIONS=$(gh api -XGET \
            "/users/${{ github.repository_owner }}/packages/container/visual-regression-frontend/versions" \
            --jq 'sort_by(.created_at) | reverse | .[].id')

          if [ -z "$VERSIONS" ]; then
            echo "No versions found"
            exit 0
          fi

          echo "Found versions: $VERSIONS"

          COUNT=0
          for VERSION_ID in $VERSIONS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting frontend version: $VERSION_ID"
              gh api -XDELETE "/users/${{ github.repository_owner }}/packages/container/visual-regression-frontend/versions/$VERSION_ID" || echo "Failed to delete $VERSION_ID, skipping"
            fi
          done

          echo "Kept $KEEP latest images, deleted older ones"
