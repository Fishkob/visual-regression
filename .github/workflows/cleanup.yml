name: Cleanup old images

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 3am
  workflow_dispatch:
    inputs:
      keep:
        description: "Untagged versions to keep per image"
        required: false
        type: string
        default: "5"

permissions:
  packages: write

# A cron run and a manual dispatch can overlap; deleting the same version twice
# would report a 404 that is nobody's fault.
concurrency:
  group: cleanup-images
  cancel-in-progress: false

jobs:
  cleanup:
    name: Cleanup ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - visual-regression-backend
          - visual-regression-frontend
          - visual-regression-worker
          - pdf-sidecar
          - visual-regression-migrate
    steps:
      # Only untagged versions are deleted: a released tag is what an operator
      # pins for a rollback and has to stay pullable, while an untagged version is
      # a leftover of a rebuilt release that nothing but a digest can reach.
      #
      # This holds because every image is built single-platform. Adding
      # `platforms:` to the build in release-images.yml would make the untagged
      # platform children of a multi-arch index look like leftovers, and deleting
      # them breaks the tagged parent.
      - uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: ${{ matrix.image }}
          package-type: container
          delete-only-untagged-versions: "true"
          min-versions-to-keep: ${{ github.event.inputs.keep || '5' }}
