name: Cleanup old images

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday at 3am
  workflow_dispatch:
    inputs:
      keep:
        description: "Number of image versions to keep"
        required: false
        type: string
        default: "5"

permissions:
  packages: write

jobs:
  cleanup:
    name: Cleanup ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - visual-regression-backend
          - visual-regression-frontend
          - visual-regression-worker
          - pdf-sidecar
          - visual-regression-migrate
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete old versions
        run: |
          KEEP=${{ github.event.inputs.keep || '5' }}

          echo "Fetching ${{ matrix.image }} versions (newest first)..."
          VERSIONS=$(gh api -XGET \
            "/users/${{ github.repository_owner }}/packages/container/${{ matrix.image }}/versions" \
            --jq 'sort_by(.created_at) | reverse | .[].id')

          if [ -z "$VERSIONS" ]; then
            echo "No versions found"
            exit 0
          fi

          COUNT=0
          for VERSION_ID in $VERSIONS; do
            COUNT=$((COUNT + 1))
            if [ $COUNT -gt $KEEP ]; then
              echo "Deleting ${{ matrix.image }} version: $VERSION_ID"
              gh api -XDELETE "/users/${{ github.repository_owner }}/packages/container/${{ matrix.image }}/versions/$VERSION_ID" || echo "Failed to delete $VERSION_ID, skipping"
            fi
          done

          echo "Kept $KEEP latest versions of ${{ matrix.image }}"
