name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - backend
          - frontend
          - both
      skipTests:
        description: "Skip tests"
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/visual-regression-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/visual-regression-frontend
  IMAGE_WORKER: ghcr.io/${{ github.repository_owner }}/visual-regression-worker
  IMAGE_PDF_SIDECAR: ghcr.io/${{ github.repository_owner }}/pdf-sidecar
  IMAGE_MIGRATE: ghcr.io/${{ github.repository_owner }}/visual-regression-migrate

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.target == 'backend' || github.event.inputs.target == 'both') && github.event.inputs.skipTests != 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Run lint & typecheck
        run: pnpm run lint:check && pnpm run typecheck
        working-directory: backend

      - name: Run unit tests
        run: pnpm --filter ./backend test -- test/unit

      - name: Start infra
        run: docker compose -f docker-compose.infra.yml up -d

      - name: Wait for infra
        run: |
          READY=0
          for i in {1..60}; do
            if docker exec postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            docker logs postgres
            echo "❌ Postgres did not become ready in time"
            exit 1
          fi

      - name: Run e2e tests
        working-directory: backend
        env:
          NODE_ENV: test
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public
          STORAGE_ENDPOINT: 127.0.0.1
          STORAGE_PORT: "9000"
          STORAGE_ACCESS_KEY: rustfsadmin
          STORAGE_SECRET_KEY: rustfsadmin
          STORAGE_BUCKET: vrt
          STORAGE_USE_SSL: "false"
        run: pnpm run test:e2e:ci

      - name: Dump docker logs
        if: failure()
        run: docker compose -f docker-compose.infra.yml logs --no-color

      - name: Shutdown infra
        if: always()
        run: docker compose -f docker-compose.infra.yml down -v

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    if: ${{ (github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both') && github.event.inputs.skipTests != 'true' }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Run lint & typecheck
        working-directory: frontend
        run: pnpm run lint:check && pnpm run typecheck

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: ${{ github.event.inputs.target == 'backend' || github.event.inputs.target == 'both' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: [test-frontend]
    if: ${{ github.event.inputs.target == 'frontend' || github.event.inputs.target == 'both' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Copy client-sdk to frontend
        run: cp -r client-sdk frontend/client-sdk

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-worker:
    name: Build Worker
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: ${{ (github.event.inputs.target == 'backend' || github.event.inputs.target == 'both') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_WORKER }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile.worker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-pdf-sidecar:
    name: Build PDF Sidecar
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: ${{ (github.event.inputs.target == 'backend' || github.event.inputs.target == 'both') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "false"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PDF_SIDECAR }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push pdf-sidecar
        uses: docker/build-push-action@v7
        with:
          context: ./pdf-sidecar
          file: ./pdf-sidecar/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-migrate:
    name: Build Migrate Image
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: ${{ (github.event.inputs.target == 'backend' || github.event.inputs.target == 'both') }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_MIGRATE }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./backend/Dockerfile.migrate
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifests:
    name: Update K8s Manifests
    needs:
      [
        build-backend,
        build-frontend,
        build-worker,
        build-pdf-sidecar,
        build-migrate,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get short SHA
        id: sha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update image tag in values.yaml
        run: |
          SHORT_SHA="${{ steps.sha.outputs.sha }}"
          TARGET="${{ github.event.inputs.target }}"

          IMAGE_TAG="sha-${SHORT_SHA}"
          if [ "$TARGET" = "backend" ] || [ "$TARGET" = "both" ]; then
            sed -i '/name: visual-regression-backend$/{n;s|tag:.*|tag: '"${IMAGE_TAG}"'|}' deploy/charts/vrt/values.yaml
            sed -i '/name: visual-regression-worker$/{n;s|tag:.*|tag: '"${IMAGE_TAG}"'|}' deploy/charts/vrt/values.yaml
            sed -i '/name: pdf-sidecar$/{n;s|tag:.*|tag: '"${IMAGE_TAG}"'|}' deploy/charts/vrt/values.yaml
            sed -i '/name: visual-regression-migrate$/{n;s|tag:.*|tag: '"${IMAGE_TAG}"'|}' deploy/charts/vrt/values.yaml
          fi

          if [ "$TARGET" = "frontend" ] || [ "$TARGET" = "both" ]; then
            sed -i '/name: visual-regression-frontend$/{n;s|tag:.*|tag: '"${IMAGE_TAG}"'|}' deploy/charts/vrt/values.yaml
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/charts/vrt/values.yaml
          git diff --staged --quiet || git commit -m "chore(deploy): update image tag to ${{ steps.sha.outputs.sha }}"
          git push
