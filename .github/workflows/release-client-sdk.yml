name: Release client SDK

# The TypeScript client is published to npm as `@fishkob/vrt` and has its own
# version line: release-please owns `client-sdk/package.json`, the tag is
# `vrt-client-vX.Y.Z`, and the version comes from the tagged package.json — not
# from the platform tag. See docs/adr/ADR-069-independent-client-version.md.
#
# The release run in release-please.yml calls this workflow directly when
# release-please reports a `client-sdk` release, because a release created with
# GITHUB_TOKEN does not emit a workflow-starting event. The `release` trigger
# stays for a client release a human publishes; `workflow_dispatch` re-runs the
# publish for a client tag whose run failed.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Client release tag (vrt-client-vX.Y.Z) to publish"
        required: true
        type: string
    # A called workflow sees only the secrets it declares. Without this the
    # caller's `secrets:` mapping is rejected, and the token check below reads
    # an empty NPM_TOKEN — the publish is then skipped, silently, on the one
    # path release-please actually uses. Optional so a fork without the secret
    # still runs the pack/verify steps.
    secrets:
      NPM_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: "Client release tag (vrt-client-vX.Y.Z) to publish"
        required: true
        type: string

# Workflow-level default: nothing. The single job below declares the two scopes
# it needs, so nothing here inherits write access to the repository.
permissions: {}

jobs:
  package:
    name: Publish and attach client SDK
    # A platform release must not touch the client: only the client line
    # publishes here.
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'vrt-client-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Attaching the tarball to the release writes to the repository.
      contents: write
      # npm signs the provenance attestation with a certificate minted from this
      # job's OIDC token. Without it the published tarball is anonymous.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # A dispatch input is a free-form string and actions/checkout resolves a
      # branch name just as happily as a tag, which would run this branch's own
      # packaging script and publish it as @fishkob/vrt for every consumer.
      # The ref must therefore be a client tag that sits on main and matches the
      # version the tagged package.json declares.
      - name: Verify the ref is a client tag on main
        env:
          REF: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/main:refs/remotes/origin/main' '+refs/tags/*:refs/tags/*'
          git rev-parse --verify --quiet "refs/tags/${REF}^{commit}" >/dev/null ||
            { echo "::error::$REF is not a tag"; exit 1; }
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main ||
            { echo "::error::$REF is not on main"; exit 1; }
          VERSION=$(node -p 'require("./client-sdk/package.json").version')
          [ "vrt-client-v${VERSION}" = "$REF" ] ||
            {
              echo "::error::$REF does not match the client-sdk version $VERSION"
              exit 1
            }

      - uses: ./.github/actions/setup

      # The version lives in the tagged package.json; nothing stamps the tag.
      - name: Read the client version
        id: version
        run: echo "version=$(node -p 'require("./client-sdk/package.json").version')" >>"$GITHUB_OUTPUT"

      # Builds, packs, installs the tarball into an empty project and imports
      # every subpath — a broken bundle fails here, not in a consumer's CI.
      - name: Build, pack and verify the tarball
        env:
          PACKAGE_OUT_DIR: ${{ runner.temp }}/client-sdk
        run: ./scripts/check-client-sdk-package.sh

      # A step's own `env` is not in scope for that step's `if` — GitHub
      # evaluates the condition before the environment exists. The token check
      # is therefore its own step and reports through an output, which also
      # keeps NPM_TOKEN out of every other step's environment.
      - name: Check for an npm token
        id: npm-token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "configured=false" >>"$GITHUB_OUTPUT"
          fi

      # NPM_TOKEN is a granular access token with write access to @fishkob.
      # Classic tokens no longer exist, and a write-enabled granular token
      # expires within 90 days — trusted publishing (OIDC) retires it once the
      # package config records this workflow as its publisher.
      #
      # Provenance is on: npm attests a public source repository, and this one
      # is public since the 1.0.0 baseline, so consumers get a signed link from
      # the tarball back to the commit and the workflow that built it.
      #
      # The gate's tarball is what gets published, not a rebuild: `npm version`
      # and `npm publish` in this workspace make npm rebuild the lockfile over
      # pnpm's symlinks, and arborist's link dedupe dies on them
      # ("Cannot read properties of null (reading 'matches')").
      #
      # The workspace root owns npm's project config, so a `.npmrc` next to
      # client-sdk is never read — the token has to arrive as an explicit
      # `--userconfig`, which is also why this runs outside the workspace.
      - name: Publish the package to npm
        if: steps.npm-token.outputs.configured == 'true'
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TARBALL="$RUNNER_TEMP/client-sdk/fishkob-vrt-${VERSION}.tgz"
          test -f "$TARBALL" || { echo "::error::missing $TARBALL"; exit 1; }
          # A re-run must not fail on a version this workflow already published.
          if npm view "@fishkob/vrt@${VERSION}" version >/dev/null 2>&1; then
            echo "::notice::@fishkob/vrt@${VERSION} is already published; skipping."
            exit 0
          fi
          NPMRC="$RUNNER_TEMP/npmrc"
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >"$NPMRC"
          trap 'rm -f "$NPMRC"' EXIT
          npm publish "$TARBALL" --access public --userconfig="$NPMRC"

      - name: Note the skipped npm publish
        if: steps.npm-token.outputs.configured != 'true'
        run: echo "::warning::NPM_TOKEN is not configured; @fishkob/vrt was not published to npm."

      # `--clobber` let a run replace the tarball of a release it did not build
      # (the tag is an input). The first upload is the record: a re-run notices
      # the asset and leaves it alone.
      #
      # With repository-level release immutability the upload only succeeds while
      # the release is still a draft, so an already-published release is skipped
      # instead of turning the run red — but only when npm took the tarball. A
      # release that carries the build in neither channel is not a success: it
      # is an artifact nobody can install, and it has to say so.
      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          # `configured` means the publish step ran and succeeded, whether it
          # uploaded or found the version already on the registry. Both mean npm
          # has the tarball.
          NPM_CONFIGURED: ${{ steps.npm-token.outputs.configured }}
        run: |
          set -euo pipefail
          RELEASE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          DRAFT=$(jq -r '.draft' <<<"$RELEASE")
          IMMUTABLE=$(jq -r '.immutable // false' <<<"$RELEASE")
          if [ "$DRAFT" != "true" ] && [ "$IMMUTABLE" = "true" ]; then
            if [ "${NPM_CONFIGURED:-false}" = "true" ]; then
              echo "::notice::$TAG is published and immutable; the tarball lives on npm."
              exit 0
            fi
            echo "::error::$TAG is immutable and nothing carries the build: npm was skipped for a missing NPM_TOKEN, and a published release cannot accept assets. Re-run this workflow by hand with the token configured."
            exit 1
          fi
          for tarball in "$RUNNER_TEMP"/client-sdk/*.tgz; do
            name="$(basename "$tarball")"
            if jq -r '.assets[].name' <<<"$RELEASE" | grep -qxF "$name"; then
              echo "::notice::$name is already attached to $TAG; leaving it untouched."
            else
              gh release upload "$TAG" "$tarball"
            fi
          done
