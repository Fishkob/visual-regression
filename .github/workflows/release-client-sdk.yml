name: Release client SDK

# The TypeScript client ships as a release asset, not from a registry: the
# version in the tarball is the git tag, so a consumer pins exactly the build
# that belongs to their server. See docs/adr/ADR-056-client-sdk-distribution.md.
#
# The release run in release-please.yml calls this workflow directly, because a
# release created with GITHUB_TOKEN does not emit a workflow-starting event. The
# `release` trigger stays for a release a human publishes; `workflow_dispatch`
# re-uploads the tarball for a tag whose run failed.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to package and attach the tarball to"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and attach the tarball to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package and attach client SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: ./.github/actions/setup

      # Builds, packs, installs the tarball into an empty project and imports
      # every subpath — a broken bundle fails here, not in a consumer's CI.
      - name: Build, pack and verify the tarball
        env:
          PACKAGE_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
          PACKAGE_OUT_DIR: ${{ runner.temp }}/client-sdk
        run: ./scripts/check-client-sdk-package.sh

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/client-sdk/*.tgz --clobber
