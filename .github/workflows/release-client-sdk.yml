name: Release client SDK

# The TypeScript client is published to npm as `@fishkob/vrt`, with the release
# tag as its version, and the same tarball is attached to the release as an
# offline mirror. See docs/adr/ADR-068-client-sdk-on-npm.md.
#
# The release run in release-please.yml calls this workflow directly, because a
# release created with GITHUB_TOKEN does not emit a workflow-starting event. The
# `release` trigger stays for a release a human publishes; `workflow_dispatch`
# re-uploads the tarball for a tag whose run failed.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to package and publish"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Publish and attach client SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: ./.github/actions/setup

      # Builds, packs, installs the tarball into an empty project and imports
      # every subpath — a broken bundle fails here, not in a consumer's CI.
      - name: Build, pack and verify the tarball
        env:
          PACKAGE_VERSION: ${{ inputs.tag || github.event.release.tag_name }}
          PACKAGE_OUT_DIR: ${{ runner.temp }}/client-sdk
        run: ./scripts/check-client-sdk-package.sh

      # NPM_TOKEN is a granular access token with write access to @fishkob.
      # Classic tokens no longer exist, and a write-enabled granular token
      # expires within 90 days — trusted publishing (OIDC) replaces it once the
      # package exists. Provenance stays opted out: npm only attests a public
      # source repository, and this one is private.
      - name: Publish the package to npm
        if: env.NPM_TOKEN != ''
        working-directory: client-sdk
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          # A re-run must not fail on a version this workflow already published.
          if npm view "@fishkob/vrt@${TAG#v}" version >/dev/null 2>&1; then
            echo "::notice::@fishkob/vrt@${TAG#v} is already published; skipping."
            exit 0
          fi
          npm version "${TAG#v}" --no-git-tag-version --allow-same-version
          # setup-node runs without registry-url, so there is no .npmrc that
          # substitutes NODE_AUTH_TOKEN; write one for this step only. npm never
          # packs a .npmrc, and the trap drops it even when the publish fails.
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" >.npmrc
          trap 'rm -f .npmrc' EXIT
          npm publish --access public

      - name: Note the skipped npm publish
        if: env.NPM_TOKEN == ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "::warning::NPM_TOKEN is not configured; @fishkob/vrt was not published to npm."

      - name: Attach the tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" "$RUNNER_TEMP"/client-sdk/*.tgz --clobber
