name: Release Images

on:
  workflow_call:
    inputs:
      ref:
        description: "Release tag to build (vX.Y.Z)"
        required: true
        type: string
    # Optional, so a fork without the token still builds: the chart bump then
    # falls back to `github.token` and keeps the approval step that token forces
    # on the pull request it opens.
    secrets:
      RELEASE_PLEASE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to (re)build, e.g. v3.4.0 — never a branch"
        required: true
        type: string

# Workflow-level default: nothing. Every job below declares only the scopes it
# uses, so a job that never pushes cannot inherit `contents: write`.
permissions: {}

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  version:
    name: Resolve the version to publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      value: ${{ steps.read.outputs.value }}
      sha: ${{ steps.read.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          # The ancestry check below needs main's history, not one commit.
          fetch-depth: 0
          persist-credentials: false

      # Branch protection covers main, not tags: a force-pushed tag publishes
      # unreviewed code under a version an operator already pinned. The version
      # check below only proves the tag matches package.json, so the commit the
      # tag points at has to be proven reachable from main as well.
      - name: The tag must point at a commit on main
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main ||
            {
              echo "::error::$REF is not on main; releasing it would publish unreviewed code"
              exit 1
            }

      # The tag is what users pin and what the chart rewrite has to match. A
      # version read from anywhere else (main, a branch head) publishes code
      # under a tag that does not contain it.
      - name: Read and verify the version
        id: read
        env:
          REF: ${{ inputs.ref || github.ref }}
        run: |
          VALUE=$(node -p "require('./package.json').version")
          [ -n "$VALUE" ] || { echo "::error::could not read package.json version"; exit 1; }

          case "$REF" in
            refs/tags/v*) TAG="${REF#refs/tags/}" ;;
            v[0-9]*) TAG="$REF" ;;
            *) TAG="" ;;
          esac

          if [ -z "$TAG" ]; then
            echo "::error::no release tag: got '$REF' — images are only published from a vX.Y.Z tag"
            exit 1
          fi
          if [ "v$VALUE" != "$TAG" ]; then
            echo "::error::$TAG does not match the package.json version $VALUE"
            exit 1
          fi

          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          # The commit inside the image, for the provenance label: metadata-action
          # defaults to github.sha, which on a dispatch is the branch head and on
          # the release call is main, never the tag that was checked out.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      # Sigstore signs the attestation with a certificate minted from this
      # job's OIDC token; `attestations` stores it next to the repository.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: visual-regression-backend
            context: .
            file: ./backend/Dockerfile
          - image: visual-regression-frontend
            context: .
            file: ./frontend/Dockerfile
          - image: visual-regression-worker
            context: .
            file: ./backend/Dockerfile.worker
          - image: pdf-sidecar
            context: ./pdf-sidecar
            file: ./pdf-sidecar/Dockerfile
          - image: visual-regression-migrate
            context: .
            file: ./backend/Dockerfile.migrate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          tags: type=raw,value=${{ needs.version.outputs.value }}
          # `docker inspect` has to name the commit that is inside the image, not
          # the workflow's SHA: a released image is pinned by digest and its
          # revision label is what a consumer checks against the tag.
          labels: |
            org.opencontainers.image.revision=${{ needs.version.outputs.sha }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A released image carries its own SLSA provenance and an SPDX SBOM, so
          # a consumer can tell this build from one pushed by a stolen token.
          provenance: mode=max
          sbom: true
          # Restore-only, in a namespace no pull request can write: a released
          # image is compiled from the tagged source, never from a cache someone
          # else seeded.
          cache-from: type=gha,scope=release-${{ matrix.image }}

      - name: Attest the published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Storage records exist for organization-owned repositories only; this
          # one is user-owned and the step would fail with the default true.
          create-storage-record: "false"

  bump-chart:
    name: Bump chart image tags
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # The version comes from the job that built the images, not from main:
      # by the time this runs, main may already carry the next release.
      - name: Update the chart to the published version
        env:
          VERSION: ${{ needs.version.outputs.value }}
        run: |
          for name in visual-regression-backend visual-regression-frontend visual-regression-worker pdf-sidecar visual-regression-migrate; do
            sed -i "/name: ${name}$/{n;s|tag:.*|tag: ${VERSION}|;}" deploy/charts/vrt/values.yaml
          done
          sed -i "s|^appVersion:.*|appVersion: ${VERSION}|" deploy/charts/vrt/Chart.yaml

          # sed that silently matches nothing would leave the chart on the old
          # images and still report success.
          TAGS=$(grep -c "^    tag: ${VERSION}$" deploy/charts/vrt/values.yaml || true)
          [ "$TAGS" -eq 5 ] || { echo "::error::expected 5 image tags at ${VERSION}, found ${TAGS}"; exit 1; }
          grep -q "^appVersion: ${VERSION}$" deploy/charts/vrt/Chart.yaml ||
            { echo "::error::Chart.yaml appVersion is not ${VERSION}"; exit 1; }

      # main is protected: the ruleset requires a pull request and the two CI
      # gates and grants no bypass, so the bump lands as a pull request that
      # auto-merges once the gates are green.
      # The commit message carries no [skip ci] — a skipped CI run never reports
      # the required checks, and auto-merge would wait forever.
      - name: Open the chart bump pull request
        env:
          VERSION: ${{ needs.version.outputs.value }}
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          BRANCH="chore/chart-images-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add deploy/charts/vrt/values.yaml deploy/charts/vrt/Chart.yaml
          if git diff --staged --quiet; then
            echo "the chart already points at ${VERSION}; nothing to do."
            exit 0
          fi
          git commit -m "chore(release): bump chart image tags to ${VERSION}"
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "pull request for ${BRANCH} already exists; branch force-pushed."
          else
            gh pr create --base main --head "$BRANCH" \
              --title "chore(release): bump chart image tags to ${VERSION}" \
              --body "Automated chart bump for the ${VERSION} release. Merges itself once the CI gates are green."
          fi
          gh pr merge --squash --auto "$BRANCH"
