name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  tests:
    name: Test release
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup

      - name: Backend lint, typecheck & unit tests
        working-directory: backend
        run: pnpm run lint:check && pnpm run typecheck && pnpm run typecheck:test && pnpm run test -- test/unit

      - name: Frontend lint, typecheck & unit tests
        working-directory: frontend
        run: pnpm run lint:check && pnpm run typecheck && pnpm run test

  build-images:
    name: Build release images
    needs: [release-please, tests]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-images.yml
