name: Release

on:
  push:
    branches: [main]
  # A dispatch re-runs release-please on main, so a release that never got cut
  # (a failed run, a fixed workflow) does not need an empty commit.
  workflow_dispatch:

# Workflow-level default: nothing. Only the release-please job writes (it cuts
# the tag and opens the release PR); every downstream job declares its own scopes
# and a called workflow can only downgrade them from there.
permissions: {}

# Two pushes in the same minute would otherwise cut the same version twice and
# race for the tag: one run at a time, newest pending wins.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # JSON array of the package paths that got a release. A platform release
      # and a client release are separate lines (ADR-069), so every downstream
      # job filters on the path it cares about instead of on releases_created.
      paths_released: ${{ steps.release.outputs.paths_released }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      client_tag_name: ${{ steps.release.outputs['client-sdk--tag_name'] }}
    steps:
      # The release PR is opened with a token, not `github.token`: a pull request
      # created by the repository token has no trusted author, so every workflow
      # run it starts waits for a maintainer's approval. `RELEASE_PLEASE_TOKEN`
      # is a fine-grained token with `contents`, `pull-requests` and `issues`
      # write; without it the job falls back to `github.token` and keeps the
      # approval step described in docs/deployment.md.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  tests:
    name: Test release
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Backend lint, typecheck & unit tests
        working-directory: backend
        run: pnpm run lint:check && pnpm run typecheck && pnpm run typecheck:test && pnpm run test -- test/unit

      - name: Frontend lint, typecheck & unit tests
        working-directory: frontend
        run: pnpm run lint:check && pnpm run typecheck && pnpm run test

  build-images:
    name: Build release images
    needs: [release-please, tests]
    if: needs.release-please.outputs.releases_created == 'true' && contains(fromJSON(needs.release-please.outputs.paths_released), '.')
    permissions:
      contents: write
      packages: write
      # The bump-chart job inside the reusable workflow opens a pull request
      # with this job's token, and a called workflow can only downgrade the
      # caller's scopes: without pull-requests here GitHub rejects the whole
      # run at startup instead of failing the one step.
      pull-requests: write
      # The build job attests every image with Sigstore; both scopes have to be
      # granted here or the called workflow cannot mint them.
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-images.yml
    # Build what the tag points at, not whatever main has become since the
    # release was cut: the tag is the artifact users pin.
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
    # The chart bump opens its own pull request and inherits the same problem:
    # with `github.token` its CI waits for a maintainer's approval. Empty when
    # the secret is unset, which is the documented fallback.
    secrets:
      RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  publish-client-sdk:
    name: Publish the client SDK
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true' && contains(fromJSON(needs.release-please.outputs.paths_released), 'client-sdk')
    permissions:
      contents: write
      # npm's provenance attestation needs the OIDC token, and a called
      # workflow can only downgrade the caller's scopes.
      id-token: write
    # Called from here rather than left to the `release: published` trigger:
    # release-please creates the release with GITHUB_TOKEN, and a token-created
    # release does not start workflows (only workflow_dispatch,
    # repository_dispatch and pull_request are exempt). The `release` trigger in
    # the reusable workflow still covers a release a human publishes.
    uses: ./.github/workflows/release-client-sdk.yml
    with:
      tag: ${{ needs.release-please.outputs.client_tag_name }}
    # A called workflow inherits nothing on its own: without this mapping the
    # token check inside it reads an empty NPM_TOKEN and skips the publish,
    # leaving a release whose only artifact was never published.
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
