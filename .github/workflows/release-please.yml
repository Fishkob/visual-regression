name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          release-type: node

  tests:
    name: Test release
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup

      - name: Backend lint, typecheck & unit tests
        working-directory: backend
        run: pnpm run lint:check && pnpm run typecheck && pnpm run typecheck:test && pnpm run test -- test/unit

      - name: Frontend lint, typecheck & unit tests
        working-directory: frontend
        run: pnpm run lint:check && pnpm run typecheck && pnpm run test

  build-images:
    name: Build release images
    needs: [release-please, tests]
    if: needs.release-please.outputs.releases_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-images.yml
    # Build what the tag points at, not whatever main has become since the
    # release was cut: the tag is the artifact users pin.
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
