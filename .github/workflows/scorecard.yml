name: Scorecard

# OpenSSF Scorecard checks the repository's own security posture (branch
# protection, pinned dependencies, token permissions, dangerous workflow
# patterns, review requirements) and publishes the result, so a third party can
# judge this repository without trusting the badge in the README.
#
# The result is published to the OpenSSF API, not uploaded as SARIF: several
# checks (BranchProtectionID, CodeReviewID, FuzzingID) are structural for a
# single-maintainer repository and can never pass, so ~30 permanent alerts would
# bury the CodeQL and Semgrep findings the Security tab is for. The posture lives
# at https://securityscorecards.dev/viewer/?uri=github.com/Fishkob/visual-regression
on:
  branch_protection_rule:
  schedule:
    - cron: "15 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # publish_results signs the result with the repository's OIDC identity;
      # without id-token the run still analyses, it just stays private.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Kept as a workflow artifact so a run stays inspectable without the
      # Security tab; nothing here should ever become a code-scanning alert.
      - name: Keep the SARIF with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 90
          if-no-files-found: error
