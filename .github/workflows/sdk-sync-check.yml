name: SDK Sync Check

on:
  workflow_call:

jobs:
  sdk-sync-check:
    name: SDK Sync Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Export Swagger JSON
        working-directory: backend
        env:
          SWAGGER_OUT_DIR: .
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/vrt?schema=public
        run: TS_NODE_PROJECT=tsconfig.swagger.json node -r ts-node/register -r tsconfig-paths/register src/scripts/swagger-export.ts

      - name: Generate fresh SDK
        run: pnpm exec openapi-ts --file openapi-ts.config.ts

      - name: Check for SDK diff
        run: |
          if ! git diff --stat client-sdk/ | grep -q .; then
            echo "SDK is in sync with API"
          else
            echo "SDK is out of sync! Run 'pnpm run sdk:generate' to update."
            git diff client-sdk/
            exit 1
          fi

      # The sync check proves the sources match the spec; this proves the
      # artifact users install is loadable (ADR-056).
      - name: Package and import the client SDK
        run: ./scripts/check-client-sdk-package.sh
