name: Security (Container Scan)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  trivy-images:
    name: Trivy Image Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: visual-regression-backend
          - service: worker
            image: visual-regression-worker
          - service: frontend
            image: visual-regression-frontend
          - service: pdf-sidecar
            image: visual-regression-pdf-sidecar
          - service: db-migrate
            image: visual-regression-migrate
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (gha-cached)
        run: docker buildx bake -f docker-compose.yml ${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"

  trivy-config:
    name: Trivy Config Scan (IaC / Dockerfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan IaC config with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"
