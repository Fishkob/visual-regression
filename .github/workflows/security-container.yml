name: Security (Container Scan)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  trivy-images:
    name: Trivy Image Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # docker compose/bake interpolates x-app-env for the whole file, so its
    # required secrets must be set even when only one target is built.
    env:
      TOTP_ENCRYPTION_KEY: ci-container-scan-totp-0123456789abcdef
      POSTGRES_PASSWORD: postgres
      RUSTFS_ROOT_PASSWORD: rustfsadmin
      AUTH_COOKIE_SECURE: "false"
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            image: visual-regression-backend
          - service: worker
            image: visual-regression-worker
          - service: frontend
            image: visual-regression-frontend
          - service: pdf-sidecar
            image: visual-regression-pdf-sidecar
          - service: db-migrate
            image: visual-regression-migrate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # --load is what puts the image in the runner's docker store: the
      # setup-buildx builder is a docker-container, whose build output stays in
      # the builder cache, where Trivy cannot find it.
      - name: Build image (gha-cached)
        run: docker buildx bake -f docker-compose.yml --load ${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: image
          image-ref: ${{ matrix.image }}
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"

  trivy-config:
    name: Trivy Config Scan (IaC / Dockerfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - name: Scan IaC config with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"
