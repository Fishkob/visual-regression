name: Security (Dependency Scan)

on:
  workflow_dispatch:
  # Weekly, so an advisory against an unchanged lockfile still surfaces instead
  # of waiting for the next dependency bump.
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pdf-sidecar/pom.xml"
      - "osv-scanner.toml"
      - "scripts/security/**"
      - ".github/workflows/security-dependency.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pdf-sidecar/pom.xml"
      - "osv-scanner.toml"
      - "scripts/security/**"
      - ".github/workflows/security-dependency.yml"

permissions:
  contents: read
  actions: read

jobs:
  dependency-scan:
    name: Dependency Scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test lockfile classifier
        run: |
          python3 scripts/security/test_pnpm_lock.py
          python3 scripts/security/test_osv_gate.py

      # The gate is executed from the base branch, not from the pull request:
      # `scripts/security/**` is in this workflow's own trigger paths, so a PR
      # that turned osv-gate.py into `sys.exit(0)` would otherwise have its
      # change validated by the code it just neutered.
      - name: Check out the gate from the base branch
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/gate"
          git archive FETCH_HEAD scripts/security | tar -x -C "$RUNNER_TEMP/gate"
          test -f "$RUNNER_TEMP/gate/scripts/security/osv-gate.py"

      # The release publishes a SHA256SUMS file for every asset. Checking the
      # download against it is what makes a swapped or truncated binary fail the
      # run; the file name has to stay the archive's own, because that is what
      # the checksum file names.
      - name: Install osv-scanner
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          base=https://github.com/google/osv-scanner/releases/download/v2.5.0
          curl -fsSL -o osv-scanner_linux_amd64 "$base/osv-scanner_linux_amd64"
          curl -fsSL -o osv-scanner_SHA256SUMS "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          chmod +x osv-scanner_linux_amd64

      # A non-zero exit is not by itself a failure here (the scanner exits
      # non-zero when it *finds* something, and the gate below decides that).
      # What must not happen is a scan that reported an error and left nothing
      # behind still counting as a clean run.
      - name: Scan dependencies
        env:
          OSV_SCANNER: ${{ runner.temp }}/osv-scanner_linux_amd64
        run: |
          "$OSV_SCANNER" scan source --recursive --config osv-scanner.toml --format=json --output-file=osv-results.json . \
            || echo "::warning::osv-scanner exited $?; evaluating the results it wrote"
          test -s osv-results.json || {
            echo "::error::osv-scanner wrote no results — the gate must not read that as clean"
            exit 1
          }

      - name: Gate on critical/high
        run: python3 "$RUNNER_TEMP/gate/scripts/security/osv-gate.py" osv-results.json
