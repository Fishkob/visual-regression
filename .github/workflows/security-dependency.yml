name: Security (Dependency Scan)

on:
  workflow_dispatch:
  # Weekly, so an advisory against an unchanged lockfile still surfaces instead
  # of waiting for the next dependency bump.
  schedule:
    - cron: "0 4 * * 1"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pdf-sidecar/pom.xml"
      - "osv-scanner.toml"
      - "scripts/security/**"
      - ".github/workflows/security-dependency.yml"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "**/package.json"
      - "pnpm-lock.yaml"
      - "pdf-sidecar/pom.xml"
      - "osv-scanner.toml"
      - "scripts/security/**"
      - ".github/workflows/security-dependency.yml"

permissions:
  contents: read
  actions: read

jobs:
  dependency-scan:
    name: Dependency Scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Test lockfile classifier
        run: |
          python3 scripts/security/test_pnpm_lock.py
          python3 scripts/security/test_osv_gate.py

      - name: Install osv-scanner
        run: |
          curl -sSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.0/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner

      - name: Scan dependencies
        run: |
          /tmp/osv-scanner scan source --recursive --config osv-scanner.toml --format=json --output-file=osv-results.json . || true

      - name: Gate on critical/high
        run: python3 scripts/security/osv-gate.py osv-results.json
