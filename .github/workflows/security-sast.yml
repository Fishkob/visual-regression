name: Security (SAST)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "frontend/src/**"
      - "client-sdk/**"
      - "pdf-sidecar/**"
      - "scripts/security/**"
      - ".github/workflows/security-sast.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/src/**"
      - "frontend/src/**"
      - "client-sdk/**"
      - "pdf-sidecar/**"
      - "scripts/security/**"
      - ".github/workflows/security-sast.yml"

permissions:
  contents: read
  actions: read
  # upload-sarif writes the analysis into the Security tab.
  security-events: write

jobs:
  semgrep:
    name: Semgrep (security-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # The gate is executed from the base branch, not from the pull request:
      # `scripts/security/**` is in this workflow's own trigger paths, so a PR
      # that turned semgrep-gate.py into `sys.exit(0)` would otherwise have its
      # change validated by the code it just neutered.
      - name: Check out the gate from the base branch
        env:
          BASE_REF: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/gate"
          git archive FETCH_HEAD scripts/security | tar -x -C "$RUNNER_TEMP/gate"
          test -f "$RUNNER_TEMP/gate/scripts/security/semgrep-gate.py"

      # The scanner is the image, pinned by digest: `pip install semgrep==x`
      # pins one version and leaves the whole transitive wheel set to whatever
      # PyPI serves at run time, on a runner that is about to write to the
      # Security tab.
      #
      # The SARIF is captured from stdout instead of `--output`: the image runs
      # as `nobody`, which cannot create a file in a checkout owned by the
      # runner user.
      - name: Scan with semgrep
        env:
          SEMGREP_IMAGE: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
        run: |
          docker run --rm --entrypoint semgrep \
            -e SEMGREP_SEND_METRICS=off \
            -v "$PWD:/src" -w /src \
            "$SEMGREP_IMAGE" scan --config p/security-audit --sarif . \
            > semgrep.sarif || true

      # The gate below decides pass/fail; this upload makes the same findings
      # reviewable in the Security tab (and lets a future ruleset require
      # "Code scanning results"). Fork pull requests get a read-only token, so
      # the upload can only write for branches in this repository.
      - name: Upload SARIF to code scanning
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Gate on error findings
        run: python3 "$RUNNER_TEMP/gate/scripts/security/semgrep-gate.py" semgrep.sarif
