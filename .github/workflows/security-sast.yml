name: Security (SAST)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/src/**"
      - "frontend/src/**"
      - "client-sdk/**"
      - "pdf-sidecar/**"
      - "scripts/security/**"
      - ".github/workflows/security-sast.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/src/**"
      - "frontend/src/**"
      - "client-sdk/**"
      - "pdf-sidecar/**"
      - "scripts/security/**"
      - ".github/workflows/security-sast.yml"

permissions:
  contents: read
  actions: read

jobs:
  semgrep:
    name: Semgrep (security-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install semgrep==1.172.0

      - name: Scan with semgrep
        run: |
          semgrep scan --config p/security-audit --sarif --output semgrep.sarif . || true

      - name: Gate on error findings
        run: python3 scripts/security/semgrep-gate.py semgrep.sarif
