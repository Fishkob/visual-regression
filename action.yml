name: Visual Regression
description: Upload a screenshot or PDF, wait for the comparison, and fail when the change needs review or the CI run is not green.
author: Visual Regression Platform

branding:
  icon: camera
  color: purple

inputs:
  api-url:
    description: Base URL of the Visual Regression API, e.g. https://vrt.example.com
    required: true
  api-key:
    description: API key sent as the x-api-key header. Store it as a repository secret.
    required: true
  project:
    description: Project name.
    required: true
  test:
    description: Test name.
    required: true
  file:
    description: Path to the screenshot (PNG) or PDF to upload.
    required: true
  kind:
    description: Test kind, image or pdf.
    required: false
    default: image
  viewport:
    description: Viewport the capture was taken at, e.g. 1920x1080.
    required: true
  browser:
    description: Browser the capture was taken in, e.g. Chromium.
    required: true
  environment:
    description: Environment the capture was taken in, e.g. staging.
    required: true
  branch:
    description: Branch that produced the upload. Defaults to the project default branch.
    required: false
    default: ""
  run-key:
    description: CI run key that groups uploads into one run. Omit for the single-comparison behavior.
    required: false
    default: ""
  commit:
    description: Commit SHA tested by the run. Only sent when run-key is set.
    required: false
    default: ""
  commit-message:
    description: Commit message for the run. Only sent when run-key is set.
    required: false
    default: ""
  ci-url:
    description: URL back to the CI build for the run. Only sent when run-key is set.
    required: false
    default: ""
  finish-run:
    description: Finish the run after the upload and gate the step on the run status. Ignored without run-key.
    required: false
    default: "true"
  wait-seconds:
    description: Overall budget in seconds for the job wait and the run status poll.
    required: false
    default: "30"
  fail-on-pending:
    description: Fail the step when the run (or comparison) still needs human review.
    required: false
    default: "true"

outputs:
  status:
    description: Upload status (identical, baseline_created, comparison_queued), the per-upload outcome (pending_approval, approved, unchanged) or failed.
    value: ${{ steps.run.outputs.status }}
  job-id:
    description: Comparison job id for a queued comparison.
    value: ${{ steps.run.outputs.job-id }}
  comparison-id:
    description: Comparison id once the job completed and a comparison exists.
    value: ${{ steps.run.outputs.comparison-id }}
  comparison-status:
    description: Comparison status (PENDING_APPROVAL or APPROVED), when one exists.
    value: ${{ steps.run.outputs.comparison-status }}
  run-key:
    description: Run key echoed when the upload belonged to a run.
    value: ${{ steps.run.outputs.run-key }}
  run-state:
    description: Run gate state when run-key is set (open, pending, failed or passed).
    value: ${{ steps.run.outputs.run-state }}
  run-pending-count:
    description: Comparisons awaiting review in the run (status.pendingComparisons).
    value: ${{ steps.run.outputs.run-pending-count }}

runs:
  using: composite
  steps:
    - id: run
      name: Upload and wait for the comparison or run
      shell: bash
      env:
        INPUT_API_URL: ${{ inputs.api-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_TEST: ${{ inputs.test }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_KIND: ${{ inputs.kind }}
        INPUT_VIEWPORT: ${{ inputs.viewport }}
        INPUT_BROWSER: ${{ inputs.browser }}
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_RUN_KEY: ${{ inputs.run-key }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_CI_URL: ${{ inputs.ci-url }}
        INPUT_FINISH_RUN: ${{ inputs.finish-run }}
        INPUT_WAIT_SECONDS: ${{ inputs.wait-seconds }}
        INPUT_FAIL_ON_PENDING: ${{ inputs.fail-on-pending }}
      run: bash "${{ github.action_path }}/scripts/ci/github-action.sh"
