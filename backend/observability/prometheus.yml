global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: visual-regression-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          service: visual-regression-api

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: tempo

  - job_name: pdf-sidecar
    metrics_path: /metrics
    static_configs:
      - targets: ["pdf-sidecar:9464"]
        labels:
          service: pdf-sidecar

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service: alloy
