server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 30000000
      burst_size_bytes: 30000000
    global:
      max_bytes_per_trace: 5000000
