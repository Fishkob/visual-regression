apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: visual-regression
  namespace: argocd
  labels:
    app.kubernetes.io/name: visual-regression
    app.kubernetes.io/part-of: vrt
spec:
  project: default
  source:
    repoURL: https://github.com/Fishkob/visual-regression.git
    targetRevision: main
    path: deploy/charts/vrt
  destination:
    server: https://kubernetes.default.svc
    namespace: vrt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
