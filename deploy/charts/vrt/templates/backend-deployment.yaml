apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Values.namespace }}
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.backend.securityContext.runAsUser }}
        fsGroup: {{ .Values.backend.securityContext.fsGroup }}
      containers:
        - name: backend
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.backend.env.NODE_ENV }}
            - name: POSTGRES_HOST
              value: {{ .Values.backend.env.POSTGRES_HOST }}
            - name: POSTGRES_PORT
              value: "{{ .Values.backend.env.POSTGRES_PORT }}"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: postgres-db
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
            - name: MINIO_ENDPOINT
              value: {{ .Values.backend.env.MINIO_ENDPOINT }}
            - name: MINIO_PORT
              value: "{{ .Values.backend.env.MINIO_PORT }}"
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: minio-secret-key
            - name: MINIO_BUCKET
              value: {{ .Values.backend.env.MINIO_BUCKET }}
            - name: MINIO_USE_SSL
              value: "{{ .Values.backend.env.MINIO_USE_SSL }}"
            - name: MINIO_PUBLIC_URL
              value: "http://{{ .Values.minioHost }}"
            - name: CORS_ORIGIN
              value: {{ .Values.backend.env.CORS_ORIGIN }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.backend.env.OTEL_EXPORTER_OTLP_ENDPOINT }}"
          resources:
            requests:
              cpu: {{ .Values.backend.resources.requests.cpu }}
              memory: {{ .Values.backend.resources.requests.memory }}
            limits:
              cpu: {{ .Values.backend.resources.limits.cpu }}
              memory: {{ .Values.backend.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
      imagePullSecrets:
        - name: ghcr-secret
