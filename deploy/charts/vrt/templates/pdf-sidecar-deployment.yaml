{{- if .Values.pdfSidecar.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-sidecar
  namespace: {{ .Values.namespace }}
  labels:
    app: pdf-sidecar
spec:
  replicas: {{ .Values.pdfSidecar.replicas }}
  selector:
    matchLabels:
      app: pdf-sidecar
  template:
    metadata:
      labels:
        app: pdf-sidecar
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.pdfSidecar.securityContext.runAsUser }}
        fsGroup: {{ .Values.pdfSidecar.securityContext.fsGroup }}
      containers:
        - name: pdf-sidecar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          image: "ghcr.io/{{ .Values.imageOwner }}/{{ .Values.images.pdfSidecar.name }}:{{ .Values.images.pdfSidecar.tag }}"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 3001
              name: http
              protocol: TCP
          env:
            - name: OTEL_SERVICE_NAME
              value: pdf-sidecar
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "{{ .Values.pdfSidecar.env.OTEL_EXPORTER_OTLP_ENDPOINT }}"
          resources:
            requests:
              cpu: {{ .Values.pdfSidecar.resources.requests.cpu }}
              memory: {{ .Values.pdfSidecar.resources.requests.memory }}
            limits:
              cpu: {{ .Values.pdfSidecar.resources.limits.cpu }}
              memory: {{ .Values.pdfSidecar.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
