{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rustfs-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.rustfs.storage }}
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs
  namespace: {{ .Values.namespace }}
  labels:
    app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: rustfs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          image: {{ .Values.rustfs.image }}
          ports:
            - containerPort: 9000
              name: api
              protocol: TCP
            - containerPort: 9001
              name: console
              protocol: TCP
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: rustfs-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: rustfs-secret-key
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: 0.0.0.0:9000
            - name: RUSTFS_CONSOLE_ADDRESS
              value: 0.0.0.0:9001
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_OBS_LOG_DIRECTORY
              value: /app/logs
          volumeMounts:
            - name: rustfs-storage
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
          resources:
            requests:
              cpu: {{ .Values.rustfs.resources.requests.cpu }}
              memory: {{ .Values.rustfs.resources.requests.memory }}
            limits:
              cpu: {{ .Values.rustfs.resources.limits.cpu }}
              memory: {{ .Values.rustfs.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: rustfs-storage
          persistentVolumeClaim:
            claimName: rustfs-pvc
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: {{ .Values.namespace }}
  labels:
    app: rustfs
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: api
      protocol: TCP
      name: api
    - port: 9001
      targetPort: console
      protocol: TCP
      name: console
  selector:
    app: rustfs
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rustfs-init
  namespace: {{ .Values.namespace }}
  labels:
    app: rustfs-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: rustfs-init
    spec:
      containers:
        - name: rustfs-init
          image: {{ .Values.rustfs.mcImage }}
          command:
            - /bin/sh
            - -c
            - |
              mc alias set local http://rustfs:9000 $(RUSTFS_ACCESS_KEY) $(RUSTFS_SECRET_KEY)
              mc mb local/vrt || true
              mc anonymous set download local/vrt || true
              exit 0
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: rustfs-access-key
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: vrt-secrets
                  key: rustfs-secret-key
      restartPolicy: OnFailure
  backoffLimit: 3
{{- end }}
