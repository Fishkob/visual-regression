apiVersion: v1
kind: Secret
metadata:
  name: vrt-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  postgres-user: {{ .Values.secrets.postgres_user | quote }}
  postgres-password: {{ .Values.secrets.postgres_password | quote }}
  postgres-db: {{ .Values.secrets.postgres_db | quote }}
  rustfs-access-key: {{ .Values.secrets.rustfs_access_key | quote }}
  rustfs-secret-key: {{ .Values.secrets.rustfs_secret_key | quote }}
  bootstrap-admin-username: {{ .Values.secrets.bootstrap_admin_username | quote }}
  bootstrap-admin-password: {{ .Values.secrets.bootstrap_admin_password | quote }}
  admin-api-key: {{ .Values.secrets.admin_api_key | quote }}
  metrics-api-key: {{ .Values.secrets.metrics_api_key | quote }}
