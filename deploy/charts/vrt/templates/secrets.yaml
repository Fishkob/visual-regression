apiVersion: v1
kind: Secret
metadata:
  name: vrt-secrets
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  postgres-user: {{ .Values.secrets.postgres_user }}
  postgres-password: {{ .Values.secrets.postgres_password }}
  postgres-db: {{ .Values.secrets.postgres_db }}
  minio-access-key: {{ .Values.secrets.minio_access_key }}
  minio-secret-key: {{ .Values.secrets.minio_secret_key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: {{ .Values.namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.secrets.ghcr_pull_secret }}
