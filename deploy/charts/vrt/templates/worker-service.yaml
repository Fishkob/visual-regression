{{- if .Values.worker.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: {{ .Values.namespace }}
  labels:
    app: worker
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: health
      protocol: TCP
      name: health
  selector:
    app: worker
{{- end }}
