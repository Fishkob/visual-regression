namespace: vrt
domain: vrt.local
# GHCR owner/org publishing the pre-built images (ghcr.io/<imageOwner>/<name>).
# deploy.sh derives this from the git remote; forks override it via --set.
imageOwner: Fishkob
# Browser-reachable RustFS host. The backend appends `/bucket/<object>` itself,
# so this must be the base URL WITHOUT the bucket. Routed to the RustFS service
# by the ingress (see templates/ingress.yaml). Requires DNS for this host.
rustfsHost: rustfs.vrt.local

secrets:
  # WARNING: Replace all values below with your own credentials before deploying.
  # This file is tracked in git — never commit real secrets.
  postgres_user: vrt
  postgres_password: CHANGE_ME
  postgres_db: vrt
  rustfs_access_key: rustfsadmin
  rustfs_secret_key: CHANGE_ME
  # Set via env var when running deploy.sh:
  #   export GHCR_TOKEN=ghp_xxx && ./deploy/scripts/deploy.sh
  ghcr_pull_secret: ""

images:
  # The deploy workflow tags every pushed image with `latest` and `sha-<shortsha>`
  # (see .github/workflows/deploy-manual.yml). `latest` is the safe default here;
  # the workflow pins exact shas into this file after each deploy.
  backend:
    name: visual-regression-backend
    tag: latest
  frontend:
    name: visual-regression-frontend
    tag: latest
  worker:
    name: visual-regression-worker
    tag: latest
  pdfSidecar:
    name: pdf-sidecar
    tag: latest
  migrate:
    name: visual-regression-migrate
    tag: latest

tls:
  enabled: false
  secretName: vrt-tls
  clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true
  ingressNamespace: traefik

autoscaling:
  enabled: false
  backend:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
  frontend:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
  worker:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70

pdb:
  enabled: false
  minAvailable: 1

backend:
  replicas: 1
  env:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RUSTFS_ENDPOINT: rustfs
    RUSTFS_PORT: "9000"
    RUSTFS_BUCKET: vrt
    RUSTFS_USE_SSL: "false"
    CORS_ORIGIN: http://vrt.local
    TRUST_PROXY: "false"
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

frontend:
  replicas: 1
  env:
    BACKEND_HOST: backend
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsUser: 101
    fsGroup: 101

worker:
  enabled: true
  replicas: 1
  env:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RUSTFS_ENDPOINT: rustfs
    RUSTFS_PORT: "9000"
    RUSTFS_BUCKET: vrt
    RUSTFS_USE_SSL: "false"
    PDF_SIDECAR_HEALTH_URL: http://pdf-sidecar:3001/health
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

pdfSidecar:
  enabled: true
  replicas: 1
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.0-rc.3
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
