namespace: vrt
domain: vrt.local
# Browser-reachable RustFS host. The backend appends `/bucket/<object>` itself,
# so this must be the base URL WITHOUT the bucket. Routed to the RustFS service
# by the ingress (see templates/ingress.yaml). Requires DNS for this host.
rustfsHost: rustfs.vrt.local

secrets:
  # WARNING: Replace all values below with your own credentials before deploying.
  # This file is tracked in git — never commit real secrets.
  postgres_user: vrt
  postgres_password: CHANGE_ME
  postgres_db: vrt
  rustfs_access_key: minioadmin
  rustfs_secret_key: CHANGE_ME
  # Set via env var when running deploy.sh:
  #   export GHCR_TOKEN=ghp_xxx && ./deploy/scripts/deploy.sh
  ghcr_pull_secret: ""

images:
  backend:
    repository: ghcr.io/fishkob/visual-regression-backend
    tag: eb3ad4a
  frontend:
    repository: ghcr.io/fishkob/visual-regression-frontend
    tag: eb3ad4a
  worker:
    repository: ghcr.io/fishkob/visual-regression-worker
    tag: eb3ad4a
  pdfSidecar:
    repository: ghcr.io/fishkob/pdf-sidecar
    tag: eb3ad4a
  migrate:
    repository: ghcr.io/fishkob/visual-regression-migrate
    tag: eb3ad4a

tls:
  enabled: false
  secretName: vrt-tls
  clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true
  ingressNamespace: traefik

autoscaling:
  enabled: false
  backend:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
  frontend:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
  worker:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70

pdb:
  enabled: false
  minAvailable: 1

backend:
  replicas: 1
  env:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MINIO_ENDPOINT: rustfs
    MINIO_PORT: "9000"
    MINIO_BUCKET: vrt
    MINIO_USE_SSL: "false"
    CORS_ORIGIN: http://vrt.local
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

frontend:
  replicas: 1
  env:
    BACKEND_HOST: backend
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsUser: 101
    fsGroup: 101

worker:
  enabled: true
  replicas: 1
  env:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    MINIO_ENDPOINT: rustfs
    MINIO_PORT: "9000"
    MINIO_BUCKET: vrt
    MINIO_USE_SSL: "false"
    PDF_SIDECAR_HEALTH_URL: http://pdf-sidecar:3001/health
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

pdfSidecar:
  enabled: true
  replicas: 1
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

postgres:
  enabled: true
  image: postgres:16-alpine
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.0-rc.3
  mcImage: minio/mc:latest
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
