namespace: vrt
domain: vrt.local
# Scheme for every browser-reachable URL the chart builds (CORS origin, app
# links, presigned screenshot URLs, session-cookie Secure flag). Empty derives
# it from tls.enabled; set it when TLS ends in front of the ingress.
scheme: ""
# Container registry hosting the pre-built images (default: GHCR). Override to
# pull from another registry, e.g. --set registry=docker.io/<owner>.
registry: ghcr.io
# GHCR owner/org publishing the pre-built images (ghcr.io/<imageOwner>/<name>).
# Default = canonical public images (ghcr.io/fishkob/*). Forks publishing their
# own images override this via --set imageOwner=... (or chart values in ArgoCD).
imageOwner: fishkob
# Browser-reachable RustFS host. The backend appends `/bucket/<object>` itself,
# so this must be the base URL WITHOUT the bucket. Routed to the RustFS service
# by the ingress (see templates/ingress.yaml). Requires DNS for this host.
rustfsHost: rustfs.vrt.local

secrets:
  # The render fails when either password is still a placeholder: a release
  # installed with the tracked defaults used to expose an object store answering
  # to a credential printed in this repository.
  postgres_user: vrt
  postgres_password: CHANGE_ME
  postgres_db: vrt
  # The access key is a user name, not a secret; the secret key is the credential.
  rustfs_access_key: rustfsadmin
  rustfs_secret_key: CHANGE_ME
  # Bootstrap the first admin on a fresh install — only used when both are
  # non-empty. Remove them again after the first login.
  bootstrap_admin_username: ""
  bootstrap_admin_password: ""
  # Optional API keys (empty disables the DLQ admin / metrics endpoints).
  admin_api_key: ""
  metrics_api_key: ""

images:
  # Images are published by the release pipeline: release-please cuts a git tag
  # `vX.Y.Z`, and .github/workflows/release-images.yml builds every image tagged
  # `X.Y.Z` and rewrites the `tag:` values below. The pipeline does not publish
  # `latest`; the `latest` defaults here are placeholders until the first release
  # overwrites them.
  backend:
    name: visual-regression-backend
    tag: 1.0.0
  frontend:
    name: visual-regression-frontend
    tag: 1.0.0
  worker:
    name: visual-regression-worker
    tag: 1.0.0
  pdfSidecar:
    name: pdf-sidecar
    tag: 1.0.0
  migrate:
    name: visual-regression-migrate
    tag: 1.0.0

tls:
  enabled: false
  secretName: vrt-tls
  clusterIssuer: letsencrypt-prod

networkPolicy:
  enabled: true
  ingressNamespace: traefik

autoscaling:
  enabled: false
  backend:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
  frontend:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70
  worker:
    minReplicas: 1
    maxReplicas: 5
    targetCPU: 70

pdb:
  enabled: false
  minAvailable: 1

backend:
  replicas: 1
  env:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RUSTFS_ENDPOINT: rustfs
    RUSTFS_PORT: "9000"
    RUSTFS_BUCKET: vrt
    RUSTFS_USE_SSL: "false"
    RUSTFS_SIGNED_URL_TTL_SECONDS: "3600"
    RUSTFS_ENSURE_PUBLIC_BUCKET: "false"
    # Both empty derive the scheme from `scheme`/`tls.enabled`. Set them only
    # when the UI is reached through a different host than `domain`.
    CORS_ORIGIN: ""
    APP_PUBLIC_URL: ""
    # The chart routes the API through the ingress (see templates/ingress.yaml),
    # which sets X-Forwarded-For; without this every client shares the ingress
    # IP in the per-IP rate-limit buckets.
    TRUST_PROXY: "true"
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    # Empty follows `tls.enabled`: a deployment that terminates TLS has to send
    # an HTTPS-only session cookie, and one that does not cannot. Set "true"
    # behind an external TLS terminator that the chart does not know about.
    AUTH_COOKIE_SECURE: ""
    # Postgres connections per process; keep replicas x pool below the
    # database's max_connections.
    DATABASE_POOL_MAX: "10"
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

frontend:
  replicas: 1
  env:
    BACKEND_HOST: backend
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsUser: 101
    fsGroup: 101

worker:
  enabled: true
  replicas: 1
  # Extra pod annotations, e.g. prometheus.io/scrape for a scrape-config-based
  # Prometheus. The worker metrics endpoint needs the x-metrics-key header, so a
  # Prometheus Operator setup should use a ScrapeConfig with httpHeaders rather
  # than annotation scraping.
  podAnnotations: {}
  env:
    NODE_ENV: production
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RUSTFS_ENDPOINT: rustfs
    RUSTFS_PORT: "9000"
    RUSTFS_BUCKET: vrt
    RUSTFS_USE_SSL: "false"
    PDF_SIDECAR_HEALTH_URL: http://pdf-sidecar:3001/health
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
    DATABASE_POOL_MAX: "10"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

pdfSidecar:
  enabled: true
  replicas: 1
  env:
    OTEL_EXPORTER_OTLP_ENDPOINT: ""
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    # The JVM runs with -Xmx512m; a 256Mi container limit OOM-kills the sidecar
    # on any real PDF, before the heap limit is reached.
    limits:
      cpu: 200m
      memory: 768Mi
  securityContext:
    runAsUser: 1000
    fsGroup: 1000

postgres:
  enabled: true
  image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
  storage: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

rustfs:
  enabled: true
  image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
