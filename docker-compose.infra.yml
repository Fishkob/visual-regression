services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-vrt}
    # Local-only: bound to 127.0.0.1 so the DB isn't reachable from the LAN.
    # The backend/worker connect via the compose network, not this host port.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.1
    restart: always
    depends_on:
      volume-permission-helper:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: /app/logs
    volumes:
      - rustfsdata:/data
      - rustfslogs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  volume-permission-helper:
    image: alpine:3.24.2
    volumes:
      - rustfsdata:/data
      - rustfslogs:/logs
    command: >
      sh -c "
        chown -R 10001:10001 /data /logs &&
        echo 'Volume permissions fixed' &&
        exit 0
      "
    restart: "no"

volumes:
  pgdata:
  rustfsdata:
  rustfslogs:
