services:
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12345:12345"
    volumes:
      - ./backend/observability/alloy.alloy:/etc/alloy/alloy.alloy
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/alloy.alloy
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:3.1.0
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo-config.yml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - ./backend/observability/tempo-config.yml:/etc/tempo-config.yml
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki-config.yml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./backend/observability/loki-config.yml:/etc/loki-config.yml
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-remote-write-receiver"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./backend/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./backend/observability/secrets:/etc/prometheus/secrets:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - ./backend/observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./backend/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./backend/observability/grafana/dashboards:/etc/grafana/dashboards
      - ./backend/observability/grafana/alerting:/etc/grafana/provisioning/alerting
      - grafana-data:/var/lib/grafana

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
