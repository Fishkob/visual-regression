services:
  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    restart: unless-stopped
    ports:
      - "4317:4317"
      - "4318:4318"
      - "12345:12345"
    volumes:
      - ./backend/observability/alloy.river:/etc/alloy/alloy.river
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/alloy.river
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:latest
    container_name: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo-config.yml"]
    ports:
      - "3200:3200"
    volumes:
      - ./backend/observability/tempo-config.yml:/etc/tempo-config.yml
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki-config.yml"]
    ports:
      - "3100:3100"
    volumes:
      - ./backend/observability/loki-config.yml:/etc/loki-config.yml
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--enable-feature=remote-write-receiver"
    ports:
      - "9090:9090"
    volumes:
      - ./backend/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3030:3000"
    volumes:
      - ./backend/observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./backend/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./backend/observability/grafana/dashboards:/etc/grafana/dashboards
      - ./backend/observability/grafana/alerting:/etc/grafana/provisioning/alerting
      - grafana-data:/var/lib/grafana

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
