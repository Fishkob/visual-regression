include:
  - docker-compose.infra.yml

x-build-cache: &build-cache
  x-bake:
    cache-from:
      - type=gha
    cache-to:
      - type=gha,mode=max

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-vrt}
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vrt}
  RUSTFS_ENDPOINT: rustfs
  RUSTFS_PORT: 9000
  RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfsadmin}
  RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
  RUSTFS_BUCKET: ${RUSTFS_BUCKET:-vrt}
  RUSTFS_USE_SSL: "false"
  RUSTFS_PUBLIC_URL: ${RUSTFS_PUBLIC_URL:-http://localhost:9000}
  RUSTFS_SIGNED_URL_TTL_SECONDS: ${RUSTFS_SIGNED_URL_TTL_SECONDS:-3600}
  RUSTFS_ENSURE_PUBLIC_BUCKET: ${RUSTFS_ENSURE_PUBLIC_BUCKET:-false}
  METRICS_API_KEY: ${METRICS_API_KEY:-}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  # Set to true when the stack is served over TLS (directly or behind a proxy):
  # the session cookie is then HTTPS-only.
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
  UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-60}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-5}
  LOG_RATE_LIMIT_PER_MINUTE: ${LOG_RATE_LIMIT_PER_MINUTE:-100}
  BASELINE_HISTORY_LIMIT: ${BASELINE_HISTORY_LIMIT:-10}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
  NODE_ENV: production
  WORKER_HEALTH_URL: http://worker:3003/api/v1/health
  PDF_SIDECAR_HEALTH_URL: http://pdf-sidecar:3001/health

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db-migrate:
    image: visual-regression-migrate
    build:
      context: .
      dockerfile: backend/Dockerfile.migrate
      <<: *build-cache
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: visual-regression-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      <<: *build-cache
    restart: on-failure:10
    stop_grace_period: 30s
    logging: *logging
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      <<: *app-env
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  pdf-sidecar:
    image: visual-regression-pdf-sidecar
    build:
      context: ./pdf-sidecar
      dockerfile: Dockerfile
      <<: *build-cache
    restart: on-failure:5
    logging: *logging
    ports:
      - "${PDF_SIDECAR_PORT:-3001}:3001"
    environment:
      OTEL_SERVICE_NAME: pdf-sidecar
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_METRICS_EXPORTER: prometheus
      OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: visual-regression-worker
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      <<: *build-cache
    restart: on-failure:10
    # Above the poller's 30s drain budget so SIGTERM lets the last job finish
    # instead of SIGKILLing it into a phantom retry.
    stop_grace_period: 60s
    logging: *logging
    environment:
      <<: *app-env
      NODE_MODE: worker
      OTEL_SERVICE_NAME: visual-regression-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:3003/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      pdf-sidecar:
        condition: service_healthy

  frontend:
    image: visual-regression-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      <<: *build-cache
    logging: *logging
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    environment:
      BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_started
