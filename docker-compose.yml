include:
  - docker-compose.infra.yml

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-vrt}
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-vrt}
  RUSTFS_ENDPOINT: rustfs
  RUSTFS_PORT: 9000
  RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-minioadmin}
  RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-minioadmin}
  RUSTFS_BUCKET: ${RUSTFS_BUCKET:-vrt}
  RUSTFS_USE_SSL: "false"
  RUSTFS_PUBLIC_URL: http://localhost:9000
  METRICS_API_KEY: ${METRICS_API_KEY:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NODE_ENV: production
  WORKER_HEALTH_URL: http://worker:3003/api/v1/health
  PDF_SIDECAR_HEALTH_URL: http://pdf-sidecar:3001/health

services:
  db-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: on-failure:10
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      <<: *app-env
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  pdf-sidecar:
    build:
      context: ./pdf-sidecar
      dockerfile: Dockerfile
    restart: on-failure:5
    ports:
      - "${PDF_SIDECAR_PORT:-3001}:3001"
    environment:
      OTEL_SERVICE_NAME: pdf-sidecar
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_METRICS_EXPORTER: prometheus
      OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    restart: on-failure:10
    environment:
      <<: *app-env
      NODE_MODE: worker
      OTEL_SERVICE_NAME: visual-regression-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3003/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      pdf-sidecar:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    environment:
      BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_started
