include:
  - docker-compose.infra.yml

x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — generate one with openssl rand -hex 24}
  POSTGRES_DB: ${POSTGRES_DB:-vrt}
  DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vrt}
  RUSTFS_ENDPOINT: rustfs
  RUSTFS_PORT: 9000
  RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfsadmin}
  RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:?RUSTFS_ROOT_PASSWORD is required — generate one with openssl rand -hex 24}
  RUSTFS_BUCKET: ${RUSTFS_BUCKET:-vrt}
  RUSTFS_USE_SSL: "false"
  RUSTFS_PUBLIC_URL: ${RUSTFS_PUBLIC_URL:-http://localhost:9000}
  RUSTFS_SIGNED_URL_TTL_SECONDS: ${RUSTFS_SIGNED_URL_TTL_SECONDS:-3600}
  RUSTFS_ENSURE_PUBLIC_BUCKET: ${RUSTFS_ENSURE_PUBLIC_BUCKET:-false}
  METRICS_API_KEY: ${METRICS_API_KEY:-}
  ADMIN_API_KEY: ${ADMIN_API_KEY:-}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required — generate one with openssl rand -hex 32}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # The bundled stack always serves the API through the nginx frontend, which
  # sets X-Forwarded-For. Without this every request reaches Nest from the
  # nginx container IP, so the per-IP login limit collapses into one global
  # bucket (and session IPs are wrong). Set false only when the API is exposed
  # directly, with no proxy in front.
  TRUST_PROXY: ${TRUST_PROXY:-true}
  # Set to true when the stack is served over TLS (directly or behind a proxy):
  # the session cookie is then HTTPS-only.
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  AUTH_SESSION_ABSOLUTE_MAX_DAYS: ${AUTH_SESSION_ABSOLUTE_MAX_DAYS:-90}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  WEBHOOK_DELIVERY_RETENTION_DAYS: ${WEBHOOK_DELIVERY_RETENTION_DAYS:-30}
  # 0 = off (the default). The sweep runs in the worker, so the worker needs it.
  BRANCH_RETENTION_DAYS: ${BRANCH_RETENTION_DAYS:-0}
  UPLOAD_RATE_LIMIT_PER_MINUTE: ${UPLOAD_RATE_LIMIT_PER_MINUTE:-240}
  LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-10}
  LOG_RATE_LIMIT_PER_MINUTE: ${LOG_RATE_LIMIT_PER_MINUTE:-400}
  RENDER_RATE_LIMIT_PER_MINUTE: ${RENDER_RATE_LIMIT_PER_MINUTE:-240}
  ADMIN_RATE_LIMIT_PER_MINUTE: ${ADMIN_RATE_LIMIT_PER_MINUTE:-120}
  BASELINE_HISTORY_LIMIT: ${BASELINE_HISTORY_LIMIT:-10}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost}
  # Build identity reported by /api/v1/health. install.sh derives these from the
  # checkout; the fallbacks apply when the stack is started without it (dev.sh).
  APP_VERSION: ${APP_VERSION:-dev}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  BUILD_TIME: ${BUILD_TIME:-unknown}
  NODE_ENV: production
  WORKER_HEALTH_URL: http://worker:3003/api/v1/health
  PDF_SIDECAR_HEALTH_URL: http://pdf-sidecar:3001/health

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db-migrate:
    image: visual-regression-migrate
    build:
      context: .
      dockerfile: backend/Dockerfile.migrate
      # Every image keeps its own GHA cache scope: the backend stores one cache
      # entry per scope, so a shared scope makes each image evict the cache of
      # the image built before it.
      x-bake:
        cache-from:
          - type=gha,scope=visual-regression-migrate
        cache-to:
          - type=gha,mode=max,scope=visual-regression-migrate
    environment:
      <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    image: visual-regression-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      x-bake:
        cache-from:
          - type=gha,scope=visual-regression-backend
        cache-to:
          - type=gha,mode=max,scope=visual-regression-backend
    restart: on-failure:10
    stop_grace_period: 30s
    logging: *logging
    ports:
      # Loopback-only: the frontend proxies /api. Publishing the API on
      # 0.0.0.0 would expose an origin that trusts one proxy hop, letting a
      # direct client spoof X-Forwarded-For past the IP rate limits.
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    environment:
      <<: *app-env
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost,http://localhost:80}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  pdf-sidecar:
    image: visual-regression-pdf-sidecar
    build:
      context: ./pdf-sidecar
      dockerfile: Dockerfile
      x-bake:
        cache-from:
          - type=gha,scope=visual-regression-pdf-sidecar
        cache-to:
          - type=gha,mode=max,scope=visual-regression-pdf-sidecar
    restart: on-failure:5
    logging: *logging
    ports:
      # Loopback-only, like the backend: the sidecar has no authentication of
      # its own, so publishing it on 0.0.0.0 turns any LAN host into a client of
      # an unauthenticated PDF parser. The backend/worker reach it over the
      # compose network; a host port is only for local debugging.
      - "127.0.0.1:${PDF_SIDECAR_PORT:-3001}:3001"
    environment:
      OTEL_SERVICE_NAME: pdf-sidecar
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_METRICS_EXPORTER: prometheus
      OTEL_EXPORTER_PROMETHEUS_HOST: 0.0.0.0
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    image: visual-regression-worker
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
      x-bake:
        cache-from:
          - type=gha,scope=visual-regression-worker
        cache-to:
          - type=gha,mode=max,scope=visual-regression-worker
    restart: on-failure:10
    # Above the poller's 30s drain budget so SIGTERM lets the last job finish
    # instead of SIGKILLing it into a phantom retry.
    stop_grace_period: 60s
    logging: *logging
    environment:
      <<: *app-env
      NODE_MODE: worker
      OTEL_SERVICE_NAME: visual-regression-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      OTEL_TRACES_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: none
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:3003/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      pdf-sidecar:
        condition: service_healthy

  frontend:
    image: visual-regression-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      x-bake:
        cache-from:
          - type=gha,scope=visual-regression-frontend
        cache-to:
          - type=gha,mode=max,scope=visual-regression-frontend
    logging: *logging
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    environment:
      BACKEND_HOST: backend
    depends_on:
      backend:
        condition: service_started
