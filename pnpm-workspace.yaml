packages:
  - "frontend"
  - "backend"
  - "client-sdk"

allowBuilds:
  "esbuild": true
  "vue-demi": true
  "@nestjs/core": true
  "@prisma/engines": true
  "@scarf/scarf": true
  "msgpackr-extract": true
  "prisma": true
  "protobufjs": true

# An override is the last resort, not the first answer: an advisory upstream can
# fix belongs upstream. One entry remains because
# @hey-api/json-schema-ref-parser pins js-yaml 4.2.0 exactly, below the patched
# 4.3.2, and no release of it moves that pin. Verified 2026-11-07 by removing
# each entry and diffing the lockfile; the four that changed nothing are gone.
overrides:
  "js-yaml@<4.3.2": "4.3.2"
